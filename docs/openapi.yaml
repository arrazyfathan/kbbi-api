openapi: 3.1.0
info:
  title: New KBBI API
  version: 1.1.0
  description: Scraper API for KBBI definitions, Indonesian proverbs, and Indonesian figure quotes. Every response includes an x-request-id header for request correlation.
servers:
  - url: /
    description: Same origin as the documentation page
tags:
  - name: Metadata
  - name: Health
  - name: Words
  - name: Proverbs
  - name: Indonesian Figures
paths:
  /:
    get:
      tags:
        - Metadata
      summary: Return API metadata and example URLs.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: API metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootResponse"
              examples:
                default:
                  value:
                    message: Welcome to New KBBI API
                    endpoints:
                      - /health/supabase
                      - /search/[word]
                      - /words/top
                      - /proverb
                      - /proverb/search
                      - /proverb/[slug]
                      - /figure
                      - /figure/search
                      - /figure/[slug]
                    examples:
                      - http://localhost:3000/health/supabase
                      - http://localhost:3000/search/demokrasi
                      - http://localhost:3000/words/top?limit=10
                      - http://localhost:3000/proverb?page=1&limit=20
                      - http://localhost:3000/proverb/search?q=air
                      - http://localhost:3000/proverb/Abu_saja_tak_hinggap
                      - http://localhost:3000/figure?page=1&limit=10
                      - http://localhost:3000/figure/search?q=soekarno
                      - http://localhost:3000/figure/Soekarno
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /health/supabase:
    get:
      tags:
        - Health
      summary: Check Supabase connectivity.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Supabase is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupabaseHealthResponse"
              examples:
                connected:
                  value:
                    success: true
                    message: Supabase connection successful
                    data:
                      connected: true
                      host: example.supabase.co
                      status: 200
                      statusText: OK
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Supabase is not configured or is unavailable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SupabaseHealth"
              examples:
                disconnected:
                  value:
                    success: false
                    message: Supabase connection failed
                    code: UPSTREAM_UNAVAILABLE
                    requestId: client-request-1
                    data:
                      connected: false
                      host: null
  /search/{word}:
    get:
      tags:
        - Words
      summary: Search a KBBI word.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/WordPath"
        - $ref: "#/components/parameters/VisitorIdHeader"
      responses:
        "200":
          description: Search result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/KbbiSearchResult"
              examples:
                found:
                  value:
                    success: true
                    message: Search successful
                    data:
                      word: demokrasi
                      visitorCount: 12
                      entries:
                        - headword: de.mo.kra.si /démokrasi/
                          definitions:
                            - wordClass: "n[Nomina: kata benda] Pol[Politik dan Pemerintahan: -]"
                              description: "(bentuk atau sistem) pemerintahan yang seluruh rakyatnya turut serta memerintah dengan perantaraan wakilnya; pemerintahan rakyat"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/WordNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /words/top:
    get:
      tags:
        - Words
      summary: Return the most visited KBBI words.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/TopWordsLimit"
      responses:
        "200":
          description: Top visited words.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/TopVisitedWordsResult"
              examples:
                default:
                  value:
                    success: true
                    message: Top visited words fetched successfully
                    data:
                      count: 2
                      items:
                        - word: demokrasi
                          visitorCount: 12
                        - word: ajar
                          visitorCount: 8
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
  /proverb:
    get:
      tags:
        - Proverbs
      summary: List Indonesian proverbs.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/ProverbLimit"
      responses:
        "200":
          description: Paginated proverb list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProverbResponse"
              examples:
                default:
                  value:
                    success: true
                    message: Proverb list fetched successfully
                    data:
                      source: https://id.wikiquote.org/wiki/Peribahasa_Indonesia
                      pagination:
                        page: 1
                        limit: 20
                        total: 1371
                        totalPages: 69
                        hasNextPage: true
                        hasPreviousPage: false
                      items:
                        - text: Ada gula ada semut
                          letter: A
                          slug: Ada_gula_ada_semut
                          sourceUrl: https://id.wikiquote.org/wiki/Ada_gula_ada_semut
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /proverb/search:
    get:
      tags:
        - Proverbs
      summary: Search Indonesian proverbs by text.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/ProverbLimit"
      responses:
        "200":
          description: Paginated proverb search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProverbResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /proverb/{slug}:
    get:
      tags:
        - Proverbs
      summary: Return one proverb detail page.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/ProverbSlug"
      responses:
        "200":
          description: Proverb detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/ProverbDetail"
              examples:
                default:
                  value:
                    success: true
                    message: Proverb detail fetched successfully
                    data:
                      text: Abu saja tak hinggap
                      letter: A
                      slug: Abu_saja_tak_hinggap
                      sourceUrl: https://id.wikiquote.org/wiki/Abu_saja_tak_hinggap
                      meaning: sesuatu yang sangat bersih dan berkilau
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/ProverbNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /figure:
    get:
      tags:
        - Indonesian Figures
      summary: List Indonesian figures.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/FigureLimit"
        - $ref: "#/components/parameters/IncludeFigureDetails"
      responses:
        "200":
          description: Paginated Indonesian figure list. Items are summaries unless includeDetails=true is provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedFigureResponse"
              examples:
                default:
                  value:
                    success: true
                    message: Indonesian figure list fetched successfully
                    data:
                      source: https://id.wikiquote.org/wiki/Kategori:Tokoh_Indonesia
                      pagination:
                        page: 1
                        limit: 10
                        total: 346
                        totalPages: 35
                        hasNextPage: true
                        hasPreviousPage: false
                      items:
                        - name: Soekarno
                          slug: Soekarno
                          sourceUrl: https://id.wikiquote.org/wiki/Soekarno
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /figure/search:
    get:
      tags:
        - Indonesian Figures
      summary: Search Indonesian figures by name.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/FigureLimit"
        - $ref: "#/components/parameters/IncludeFigureDetails"
      responses:
        "200":
          description: Paginated Indonesian figure search results. Items are summaries unless includeDetails=true is provided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedFigureResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /figure/{slug}:
    get:
      tags:
        - Indonesian Figures
      summary: Return one Indonesian figure detail page.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/FigureSlug"
      responses:
        "200":
          description: Indonesian figure detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/IndonesianFigure"
              examples:
                default:
                  value:
                    success: true
                    message: Indonesian figure detail fetched successfully
                    data:
                      name: Soekarno
                      slug: Soekarno
                      sourceUrl: https://id.wikiquote.org/wiki/Soekarno
                      photo: https://upload.wikimedia.org/wikipedia/commons/thumb/0/01/Presiden_Sukarno.jpg/250px-Presiden_Sukarno.jpg
                      description: Soekarno adalah presiden pertama Republik Indonesia yang menjabat pada kurun waktu 1945-1967.
                      quotes:
                        - Bangsa yang besar adalah bangsa yang menghargai jasa pahlawannya
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/FigureNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
components:
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client-provided request correlation ID. The API returns this value in the x-request-id response header, or generates one when omitted.
      schema:
        type: string
        minLength: 1
      example: client-request-1
    WordPath:
      name: word
      in: path
      required: true
      description: Word to search in KBBI.
      schema:
        type: string
        minLength: 1
      example: demokrasi
    VisitorIdHeader:
      name: X-Visitor-Id
      in: header
      required: false
      description: Stable anonymous client identifier. When present, the API counts one unique visit per word per visitor per day.
      schema:
        type: string
        minLength: 1
      example: anonymous-client-id
    TopWordsLimit:
      name: limit
      in: query
      required: false
      description: Number of words to return. Invalid values fall back to the default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 10
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    ProverbLimit:
      name: limit
      in: query
      required: false
      description: Items per page for proverb endpoints.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    FigureLimit:
      name: limit
      in: query
      required: false
      description: Items per page for Indonesian figure endpoints.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      example: 10
    IncludeFigureDetails:
      name: includeDetails
      in: query
      required: false
      description: Set to true to include photo, description, and quotes in list/search items. Defaults to false so list/search avoid per-item detail-page requests.
      schema:
        type: boolean
        default: false
      example: false
    SearchQuery:
      name: q
      in: query
      required: true
      description: Required non-empty search keyword.
      schema:
        type: string
        minLength: 1
      example: air
    ProverbSlug:
      name: slug
      in: path
      required: true
      description: Wikiquote page slug returned by proverb list or search endpoints.
      schema:
        type: string
        minLength: 1
      example: Abu_saja_tak_hinggap
    FigureSlug:
      name: slug
      in: path
      required: true
      description: Wikiquote page slug for an Indonesian figure.
      schema:
        type: string
        minLength: 1
      example: Soekarno
  responses:
    ValidationError:
      description: Request parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missingQuery:
              value:
                success: false
                message: Query parameter 'q' is required
                code: VALIDATION_ERROR
                requestId: client-request-1
                details:
                  - field: q
                    location: query
                    reason: Required non-empty string
    WordNotFound:
      description: Word was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                success: false
                message: Word not found
                code: NOT_FOUND
                requestId: client-request-1
    ProverbNotFound:
      description: Proverb was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                success: false
                message: Proverb not found
                code: NOT_FOUND
                requestId: client-request-1
    FigureNotFound:
      description: Indonesian figure was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                success: false
                message: Indonesian figure not found
                code: NOT_FOUND
                requestId: client-request-1
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                success: false
                message: Too many requests
                code: RATE_LIMITED
                requestId: client-request-1
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            production:
              value:
                success: false
                message: Internal server error
                code: INTERNAL_ERROR
                requestId: client-request-1
    UpstreamUnavailable:
      description: Scraper, Supabase, or external service is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                success: false
                message: Upstream service is unavailable
                code: UPSTREAM_UNAVAILABLE
                requestId: client-request-1
    UpstreamTimeout:
      description: Scraper or external service timed out.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                success: false
                message: Upstream request timed out
                code: UPSTREAM_TIMEOUT
                requestId: client-request-1
  schemas:
    RootResponse:
      type: object
      required:
        - message
        - endpoints
        - examples
      properties:
        message:
          type: string
        endpoints:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string
    SuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - success
        - message
        - code
        - requestId
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          $ref: "#/components/schemas/ErrorCode"
        requestId:
          type: string
          description: Request correlation ID matching the x-request-id response header.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorDetail"
        error:
          type: string
          description: Non-production diagnostic detail for unexpected errors.
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - NOT_FOUND
        - RATE_LIMITED
        - UPSTREAM_TIMEOUT
        - UPSTREAM_UNAVAILABLE
        - INTERNAL_ERROR
    ValidationErrorDetail:
      type: object
      required:
        - field
        - location
        - reason
      properties:
        field:
          type: string
        location:
          type: string
          enum:
            - body
            - params
            - query
        reason:
          type: string
    Definition:
      type: object
      required:
        - wordClass
        - description
      properties:
        wordClass:
          type: string
        description:
          type: string
    Entry:
      type: object
      required:
        - headword
        - definitions
      properties:
        headword:
          type: string
        definitions:
          type: array
          items:
            $ref: "#/components/schemas/Definition"
    KbbiSearchResult:
      type: object
      required:
        - word
        - visitorCount
        - entries
      properties:
        word:
          type: string
        visitorCount:
          type:
            - integer
            - "null"
          minimum: 0
          description: Null when X-Visitor-Id is missing or visit tracking is unavailable.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
    TopVisitedWord:
      type: object
      required:
        - word
        - visitorCount
      properties:
        word:
          type: string
        visitorCount:
          type: integer
          minimum: 0
    TopVisitedWordsResult:
      type: object
      required:
        - count
        - items
      properties:
        count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/TopVisitedWord"
    Pagination:
      type: object
      description: Page/limit pagination metadata.
      required:
        - page
        - limit
        - total
        - totalPages
        - hasNextPage
        - hasPreviousPage
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Total matching items.
        totalPages:
          type: integer
          minimum: 0
          description: Total pages calculated from total and limit.
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
    Proverb:
      type: object
      required:
        - text
        - letter
        - slug
      properties:
        text:
          type: string
        letter:
          type: string
        slug:
          type: string
        sourceUrl:
          type: string
          format: uri
    ProverbDetail:
      allOf:
        - $ref: "#/components/schemas/Proverb"
        - type: object
          required:
            - meaning
          properties:
            meaning:
              type:
                - string
                - "null"
    PaginatedProverbList:
      type: object
      required:
        - source
        - pagination
        - items
      properties:
        source:
          type: string
          format: uri
        pagination:
          $ref: "#/components/schemas/Pagination"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Proverb"
    PaginatedProverbResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/PaginatedProverbList"
    IndonesianFigureSummary:
      type: object
      required:
        - name
        - slug
        - sourceUrl
      properties:
        name:
          type:
            - string
            - "null"
        slug:
          type: string
        sourceUrl:
          type: string
          format: uri
    IndonesianFigure:
      allOf:
        - $ref: "#/components/schemas/IndonesianFigureSummary"
        - type: object
          required:
            - photo
            - description
            - quotes
          properties:
            photo:
              type:
                - string
                - "null"
              format: uri
            description:
              type:
                - string
                - "null"
            quotes:
              type:
                - array
                - "null"
              items:
                type: string
    PaginatedIndonesianFigureList:
      type: object
      required:
        - source
        - pagination
        - items
      properties:
        source:
          type: string
          format: uri
        pagination:
          $ref: "#/components/schemas/Pagination"
        items:
          type: array
          items:
            $ref: "#/components/schemas/IndonesianFigureSummary"
    PaginatedFigureResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/PaginatedIndonesianFigureList"
    SupabaseHealth:
      type: object
      required:
        - connected
        - host
      properties:
        connected:
          type: boolean
        host:
          type:
            - string
            - "null"
        status:
          type: integer
        statusText:
          type: string
    SupabaseHealthResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/SupabaseHealth"
