openapi: 3.1.0
info:
  title: New KBBI API
  version: 1.1.0
  contact:
    name: Trianurdin B
  description: Scraper API for KBBI definitions, Indonesian proverbs, and Indonesian figure quotes. Every response includes an x-request-id header for request correlation.
servers:
  - url: /
    description: Same origin as the documentation page.
tags:
  - name: Health
    description: Runtime health and dependency connectivity checks.
  - name: Indonesian Figures
    description: Indonesian figure profile and quote endpoints.
  - name: Metadata
    description: API discovery and documentation metadata.
  - name: Proverbs
    description: Indonesian proverb listing, search, and detail endpoints.
  - name: Words
    description: KBBI word search and visitor-count endpoints.
paths:
  /:
    get:
      tags:
        - Metadata
      summary: Return API metadata and example URLs.
      description: Returns a simple discovery payload with available endpoints and example URLs.
      operationId: getApiMetadata
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: API metadata and example request URLs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootResponse"
              examples:
                default:
                  value:
                    message: Welcome to New KBBI API
                    endpoints:
                      - /health/live
                      - /health/ready
                      - /health/supabase
                      - /api/v1/search/[word]
                      - /api/v1/words/top
                      - /api/v1/proverb
                      - /api/v1/proverb/search
                      - /api/v1/proverb/[slug]
                      - /api/v1/figure
                      - /api/v1/figure/search
                      - /api/v1/figure/[slug]
                    examples:
                      - http://localhost:3000/health/live
                      - http://localhost:3000/health/ready
                      - http://localhost:3000/health/supabase
                      - http://localhost:3000/api/v1/search/demokrasi
                      - http://localhost:3000/api/v1/words/top?limit=10
                      - http://localhost:3000/api/v1/proverb?page=1&limit=20
                      - http://localhost:3000/api/v1/proverb/search?q=air
                      - http://localhost:3000/api/v1/proverb/Abu_saja_tak_hinggap
                      - http://localhost:3000/api/v1/figure?page=1&limit=10
                      - http://localhost:3000/api/v1/figure/search?q=soekarno
                      - http://localhost:3000/api/v1/figure/Soekarno
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /health/live:
    get:
      tags:
        - Health
      summary: Check process liveness.
      description: Confirms the API process is running without checking external dependencies.
      operationId: getLivenessHealth
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: The API process is alive and responding to HTTP requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessHealthResponse"
              examples:
                alive:
                  value:
                    success: true
                    message: Process is alive
                    data:
                      alive: true
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /health/ready:
    get:
      tags:
        - Health
      summary: Check application readiness.
      description: Checks required configured dependencies and reports whether the app can serve traffic.
      operationId: getReadinessHealth
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Application is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessHealthResponse"
              examples:
                ready:
                  value:
                    success: true
                    message: Application is ready
                    data:
                      ready: true
                      dependencies:
                        - name: supabase
                          status: skipped
                          required: false
                          host: ""
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: A configured required dependency is unavailable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ReadinessHealth"
  /health/supabase:
    get:
      tags:
        - Health
      summary: Check Supabase connectivity.
      description: Checks whether the configured Supabase project is reachable.
      operationId: getSupabaseHealth
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Supabase is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupabaseHealthResponse"
              examples:
                connected:
                  value:
                    success: true
                    message: Supabase connection successful
                    data:
                      connected: true
                      host: example.supabase.co
                      status: 200
                      statusText: OK
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Supabase is not configured or is unavailable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SupabaseHealth"
  /search/{word}:
    get:
      tags:
        - Words
      summary: Search a KBBI word.
      description: Searches KBBI for the requested word and optionally tracks a visitor-scoped daily visit.
      operationId: searchWord
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/WordPath"
        - $ref: "#/components/parameters/VisitorIdHeader"
      responses:
        "200":
          description: KBBI word search result payload.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/KbbiSearchResult"
              examples:
                found:
                  value:
                    success: true
                    message: Search successful
                    data:
                      word: demokrasi
                      visitorCount: 12
                      entries:
                        - headword: de.mo.kra.si /démokrasi/
                          definitions:
                            - wordClass: "n[Nomina: kata benda] Pol[Politik dan Pemerintahan: -]"
                              description: "(bentuk atau sistem) pemerintahan yang seluruh rakyatnya turut serta memerintah dengan perantaraan wakilnya; pemerintahan rakyat"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/WordNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /api/v1/search/{word}:
    get:
      tags:
        - Words
      summary: Search a KBBI word.
      description: Searches KBBI for the requested word and optionally tracks a visitor-scoped daily visit.
      operationId: searchWordV1
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/WordPath"
        - $ref: "#/components/parameters/VisitorIdHeader"
      responses:
        "200":
          description: KBBI word search result payload.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/KbbiSearchResult"
              examples:
                found:
                  value:
                    success: true
                    message: Search successful
                    data:
                      word: demokrasi
                      visitorCount: 12
                      entries:
                        - headword: de.mo.kra.si /démokrasi/
                          definitions:
                            - wordClass: "n[Nomina: kata benda] Pol[Politik dan Pemerintahan: -]"
                              description: "(bentuk atau sistem) pemerintahan yang seluruh rakyatnya turut serta memerintah dengan perantaraan wakilnya; pemerintahan rakyat"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/WordNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
  /translate/{word}:
    get:
      tags:
        - Words
      summary: Translate the meanings of a KBBI word.
      description: Looks up a word in KBBI and translates the word itself and every meaning from Indonesian to the requested target language using the Google Translate scraper.
      operationId: translateWord
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/WordPath"
        - $ref: "#/components/parameters/TranslateToQuery"
      responses:
        "200":
          description: KBBI word with translated meanings payload.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/TranslateResult"
              examples:
                found:
                  value:
                    success: true
                    message: Translation successful
                    data:
                      word: demokrasi
                      translation: democracy
                      from: id
                      to: en
                      entries:
                        - headword: de.mo.kra.si /démokrasi/
                          definitions:
                            - wordClass: "n[Nomina: kata benda] Pol[Politik dan Pemerintahan: -]"
                              description: "(bentuk atau sistem) pemerintahan yang seluruh rakyatnya turut serta memerintah dengan perantaraan wakilnya; pemerintahan rakyat"
                              translation: "(form or system) of government in which all the people participate in governing through their representatives; people's government"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/WordNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
