  /words/top:
    get:
      tags:
        - Words
      summary: Return the most visited KBBI words.
      description: Returns the most visited words recorded by the visitor tracking store.
      operationId: getTopWords
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/TopWordsLimit"
      responses:
        "200":
          description: Top visited word ranking payload.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: "#/components/schemas/TopVisitedWordsResult"
              examples:
                default:
                  value:
                    success: true
                    message: Top visited words fetched successfully
                    data:
                      count: 2
                      items:
                        - word: demokrasi
                          visitorCount: 12
                        - word: ajar
                          visitorCount: 8
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
