  /proverb:
    get:
      tags:
        - Proverbs
      summary: List Indonesian proverbs.
      description: Returns a paginated list of Indonesian proverbs from Wikiquote.
      operationId: listProverbs
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/ProverbLimit"
      responses:
        "200":
          description: Paginated proverb list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProverbResponse"
              examples:
                default:
                  value:
                    success: true
                    message: Proverb list fetched successfully
                    data:
                      source: https://id.wikiquote.org/wiki/Peribahasa_Indonesia
                      pagination:
                        page: 1
                        limit: 20
                        total: 1371
                        totalPages: 69
                        hasNextPage: true
                        hasPreviousPage: false
                      items:
                        - text: Ada gula ada semut
                          letter: A
                          slug: Ada_gula_ada_semut
                          sourceUrl: https://id.wikiquote.org/wiki/Ada_gula_ada_semut
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
