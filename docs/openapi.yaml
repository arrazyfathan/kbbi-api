        "502":
          $ref: "#/components/responses/UpstreamUnavailable"
        "504":
          $ref: "#/components/responses/UpstreamTimeout"
components:
  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Optional client-provided request correlation ID. The API returns this value in the x-request-id response header, or generates one when omitted.
      schema:
        type: string
        minLength: 1
      example: client-request-1
    WordPath:
      name: word
      in: path
      required: true
      description: Word to search in KBBI.
      schema:
        type: string
        minLength: 1
      example: demokrasi
    VisitorIdHeader:
      name: X-Visitor-Id
      in: header
      required: false
      description: Stable anonymous client identifier. When present, the API hashes it with the server-side visitor salt and counts one unique visit per word per visitor per day.
      schema:
        type: string
        minLength: 1
      example: anonymous-client-id
    TranslateToQuery:
      name: to
      in: query
      required: false
      description: Target ISO 639-1/639-2 language code. Defaults to `en`.
      schema:
        type: string
        default: en
      example: en
    TopWordsLimit:
      name: limit
      in: query
      required: false
      description: Number of words to return. Invalid values fall back to the default.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 10
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    ProverbLimit:
      name: limit
      in: query
      required: false
      description: Items per page for proverb endpoints.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    FigureLimit:
      name: limit
      in: query
      required: false
      description: Items per page for Indonesian figure endpoints.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
      example: 10
    IncludeFigureDetails:
      name: includeDetails
      in: query
      required: false
      description: Set to true to include photo, description, and quotes in list/search items. Defaults to false so list/search avoid per-item detail-page requests.
      schema:
        type: boolean
        default: false
      example: false
    SearchQuery:
      name: q
      in: query
      required: true
      description: Required non-empty search keyword.
      schema:
        type: string
        minLength: 1
      example: air
    ProverbSlug:
      name: slug
      in: path
      required: true
      description: Wikiquote page slug returned by proverb list or search endpoints.
      schema:
        type: string
        minLength: 1
      example: Abu_saja_tak_hinggap
    FigureSlug:
      name: slug
      in: path
      required: true
      description: Wikiquote page slug for an Indonesian figure.
      schema:
        type: string
        minLength: 1
      example: Soekarno
  responses:
    ValidationError:
      description: Request parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missingQuery:
              value:
                success: false
                message: Query parameter 'q' is required
                code: VALIDATION_ERROR
                requestId: client-request-1
                details:
                  - field: q
                    location: query
                    reason: Required non-empty string
    WordNotFound:
      description: Requested KBBI word was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                success: false
                message: Word not found
                code: NOT_FOUND
                requestId: client-request-1
    ProverbNotFound:
      description: Proverb was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                success: false
                message: Proverb not found
                code: NOT_FOUND
                requestId: client-request-1
    FigureNotFound:
      description: Indonesian figure was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                success: false
                message: Indonesian figure not found
                code: NOT_FOUND
                requestId: client-request-1
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                success: false
                message: Too many requests
                code: RATE_LIMITED
                requestId: client-request-1
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            production:
              value:
                success: false
                message: Internal server error
                code: INTERNAL_ERROR
                requestId: client-request-1
    UpstreamUnavailable:
      description: Scraper, Supabase, or external service is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                success: false
                message: Upstream service is unavailable
                code: UPSTREAM_UNAVAILABLE
                requestId: client-request-1
    UpstreamTimeout:
      description: Scraper or external service timed out.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            default:
              value:
                success: false
                message: Upstream request timed out
                code: UPSTREAM_TIMEOUT
                requestId: client-request-1
  schemas:
    RootResponse:
      description: Discovery payload returned by the API root endpoint.
      type: object
      required:
        - message
        - endpoints
        - examples
      properties:
        message:
          type: string
        endpoints:
          type: array
          items:
            type: string
        examples:
          type: array
          items:
            type: string
    SuccessResponse:
      description: Common envelope used by successful API responses.
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
    LivenessHealth:
      description: Process liveness status data.
      type: object
      required:
        - alive
      properties:
        alive:
          type: boolean
          const: true
    LivenessHealthResponse:
      description: Successful liveness health response envelope.
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/LivenessHealth"
    DependencyHealth:
      description: Readiness status for one configured or optional dependency.
      type: object
      required:
        - name
        - status
        - required
        - host
      properties:
        name:
          type: string
          enum:
            - supabase
        status:
          type: string
          enum:
            - ok
            - failed
            - skipped
        required:
          type: boolean
        host:
          anyOf:
            - type: string
            - type: "null"
        statusCode:
          type: integer
        statusText:
          type: string
    ReadinessHealth:
      description: Application readiness status data.
      type: object
      required:
        - ready
        - dependencies
      properties:
        ready:
          type: boolean
        dependencies:
          type: array
          items:
            $ref: "#/components/schemas/DependencyHealth"
    ReadinessHealthResponse:
      description: Successful readiness health response envelope.
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/ReadinessHealth"
    ErrorResponse:
      description: Common envelope emitted by error and rate-limit middleware.
      type: object
      required:
        - success
        - message
        - code
        - requestId
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        code:
          $ref: "#/components/schemas/ErrorCode"
        requestId:
          type: string
          description: Request correlation ID matching the x-request-id response header.
        details:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorDetail"
        error:
          type: string
          description: Non-production diagnostic detail for unexpected errors.
    ErrorCode:
      description: Stable machine-readable error code values.
      type: string
      enum:
        - VALIDATION_ERROR
        - NOT_FOUND
        - RATE_LIMITED
        - UPSTREAM_TIMEOUT
        - UPSTREAM_UNAVAILABLE
        - INTERNAL_ERROR
    ValidationErrorDetail:
      description: Field-level validation failure details.
      type: object
      required:
        - field
        - location
        - reason
      properties:
        field:
          type: string
        location:
          type: string
          enum:
            - body
            - params
            - query
        reason:
          type: string
    Definition:
      description: One KBBI definition entry for a headword.
      type: object
      required:
        - wordClass
        - description
      properties:
        wordClass:
          type: string
        description:
          type: string
    Entry:
      description: KBBI headword and its definitions.
      type: object
      required:
        - headword
        - definitions
      properties:
        headword:
          type: string
        definitions:
          type: array
          items:
            $ref: "#/components/schemas/Definition"
    KbbiSearchResult:
      description: Data returned from a KBBI word search.
      type: object
      required:
        - word
        - visitorCount
        - entries
      properties:
        word:
          type: string
        visitorCount:
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
          description: Null when X-Visitor-Id is missing or visit tracking is unavailable.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
    TranslatedDefinition:
      description: One KBBI definition entry with its Google Translate result.
      allOf:
        - $ref: "#/components/schemas/Definition"
        - type: object
          required:
            - translation
          properties:
            translation:
              type: string
    TranslatedEntry:
      description: KBBI headword and its definitions with translated meanings.
      type: object
      required:
        - headword
        - definitions
      properties:
        headword:
          type: string
        definitions:
          type: array
          items:
            $ref: "#/components/schemas/TranslatedDefinition"
    TranslateResult:
      description: Data returned when translating a KBBI word's meanings.
      type: object
      required:
        - word
        - translation
        - from
        - to
        - entries
      properties:
        word:
          type: string
        translation:
          type: string
          description: The word itself translated to the target language.
        from:
          type: string
          description: Source ISO language code.
        to:
          type: string
          description: Target ISO language code.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TranslatedEntry"
    TopVisitedWord:
      description: One ranked word visit-count item.
      type: object
      required:
        - word
        - visitorCount
      properties:
        word:
          type: string
        visitorCount:
          type: integer
          minimum: 0
    TopVisitedWordsResult:
      description: Collection of the most visited KBBI words.
      type: object
      required:
        - count
        - items
      properties:
        count:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: "#/components/schemas/TopVisitedWord"
    Pagination:
      type: object
      description: Page/limit pagination metadata.
      required:
        - page
        - limit
        - total
        - totalPages
        - hasNextPage
        - hasPreviousPage
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Total matching items.
        totalPages:
          type: integer
          minimum: 0
          description: Total pages calculated from total and limit.
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
    Proverb:
      description: Indonesian proverb summary item.
      type: object
      required:
        - text
        - letter
        - slug
      properties:
        text:
          type: string
        letter:
          type: string
        slug:
          type: string
        sourceUrl:
          type: string
          format: uri
    ProverbDetail:
      description: Indonesian proverb detail with meaning.
      allOf:
        - $ref: "#/components/schemas/Proverb"
        - type: object
          required:
            - meaning
          properties:
            meaning:
              anyOf:
                - type: string
                - type: "null"
    PaginatedProverbList:
      description: Paginated Indonesian proverb result data.
      type: object
      required:
        - source
        - pagination
        - items
      properties:
        source:
          type: string
          format: uri
        pagination:
          $ref: "#/components/schemas/Pagination"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Proverb"
    PaginatedProverbResponse:
      description: Successful paginated proverb response envelope.
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/PaginatedProverbList"
    IndonesianFigureSummary:
      description: Indonesian figure summary item.
      type: object
      required:
        - name
        - slug
        - sourceUrl
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
        slug:
          type: string
        sourceUrl:
          type: string
          format: uri
    IndonesianFigure:
      description: Indonesian figure detail with profile and quotes.
      allOf:
        - $ref: "#/components/schemas/IndonesianFigureSummary"
        - type: object
          required:
            - photo
            - description
            - quotes
          properties:
            photo:
              anyOf:
                - type: string
                  format: uri
                - type: "null"
            description:
              anyOf:
                - type: string
                - type: "null"
            quotes:
              anyOf:
                - type: array
                  items:
                    type: string
                - type: "null"
    PaginatedIndonesianFigureList:
      description: Paginated Indonesian figure result data.
      type: object
      required:
        - source
        - pagination
        - items
      properties:
        source:
          type: string
          format: uri
        pagination:
          $ref: "#/components/schemas/Pagination"
        items:
          type: array
          items:
            $ref: "#/components/schemas/IndonesianFigureSummary"
    PaginatedFigureResponse:
      description: Successful paginated Indonesian figure response envelope.
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/PaginatedIndonesianFigureList"
    SupabaseHealth:
      description: Supabase connectivity status data.
      type: object
      required:
        - connected
        - host
      properties:
        connected:
          type: boolean
        host:
          anyOf:
            - type: string
            - type: "null"
        status:
          type: integer
        statusText:
          type: string
    SupabaseHealthResponse:
      description: Successful Supabase health response envelope.
      allOf:
        - $ref: "#/components/schemas/SuccessResponse"
        - type: object
          required:
            - data
          properties:
            data:
              $ref: "#/components/schemas/SupabaseHealth"
